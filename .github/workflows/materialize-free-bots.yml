name: Materialize Free Bots

on:
  push:
    branches:
      - feature/free-bots-10-xml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/free-bots-10-xml
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate local Free Bots XML library
        run: node scripts/sync-free-bots.mjs

      - name: Commit generated XML files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/free-bots
          if git diff --cached --quiet; then
            echo "Free Bots library already synchronized."
            exit 0
          fi
          git commit -m "Add 10 loadable Free Bots XML strategies"
          git push origin HEAD:feature/free-bots-10-xml
