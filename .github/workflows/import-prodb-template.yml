name: Import PROD B TRADER template

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-template:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone customized PROD B TRADER source
        run: |
          git clone --depth 1 --branch feature/prodb-premium-ui https://github.com/DukeNyamasege/trading-bot-template.git /tmp/prodb-source
          rm -rf /tmp/prodb-source/.git

      - name: Replace target contents with customized template
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          mkdir -p .github/workflows
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github/workflows' /tmp/prodb-source/ ./

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: import PROD B TRADER premium template"
          git push origin HEAD:main
