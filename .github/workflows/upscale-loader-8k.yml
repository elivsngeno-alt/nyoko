name: Upscale auth loader background to 8K

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upscale-loader-8k.yml'

permissions:
  contents: write

jobs:
  upscale:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Create 8K UHD loader asset
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter, ImageEnhance, ImageOps
          from pathlib import Path

          path = Path('src/assets/prodb-premium/auth-loader-bg.jpg')
          image = Image.open(path).convert('RGB')
          image = ImageOps.fit(image, (7680, 4320), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          image = image.filter(ImageFilter.UnsharpMask(radius=2.0, percent=125, threshold=3))
          image = ImageEnhance.Contrast(image).enhance(1.04)
          image.save(path, 'JPEG', quality=90, optimize=True, progressive=True, subsampling=0)
          print('saved', path, Image.open(path).size)
          PY

      - name: Commit 8K asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/prodb-premium/auth-loader-bg.jpg
          git commit -m "assets: upscale auth loader background to 8K"
          git push origin HEAD:main
